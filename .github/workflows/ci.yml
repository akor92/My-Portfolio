name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api:
    name: API — typecheck & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devfolio
          POSTGRES_PASSWORD: devfolio
          POSTGRES_DB: devfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devfolio:devfolio@localhost:5432/devfolio_test?schema=public
      JWT_SECRET: ci-secret-that-is-long-enough
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
