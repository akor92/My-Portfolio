# DevFolio — full local stack: Postgres + API + Web.
# Usage:  docker compose up --build
# Then:   Web  → http://localhost:8080
#         API  → http://localhost:4000/api/v1/health
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devfolio
      POSTGRES_PASSWORD: devfolio
      POSTGRES_DB: devfolio
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devfolio']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://devfolio:devfolio@db:5432/devfolio?schema=public
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_EXPIRES_IN: 1d
      CORS_ORIGINS: http://localhost:8080
      ADMIN_EMAIL: akorinnocent2@gmail.com
      ADMIN_PASSWORD: ChangeMe123!
      ADMIN_NAME: Akor Innocent Oboche
    ports:
      - '4000:4000'
    # Migrate, seed (idempotent), then start the server.
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/server.js"

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  db_data:
